[build-system]
requires = ["setuptools", "wheel", "numpy>=2.0.0rc1; python_version>='3.9'", "numpy; python_version<'3.9'"]

[tool.black]
line-length = 120

[tool.pytest.ini_options]
markers = [
        "device: Tests require connected real device",
        "opengl: Tests require opengl for GPU accelerated depth engine software"
]
addopts = "--cov=pyk4a --cov-report=xml --verbose"

[[tool.mypy.overrides]]
module = [
    "cv2",
    "matplotlib",
    "mpl_toolkits",
    "k4a_module"
]
ignore_missing_imports = true